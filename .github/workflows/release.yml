name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build archive
        run: |
          set -eu
          mkdir -p dist/rox
          cp -R rox Containerfile guest skills README.md config.example.json dist/rox/
          printf '%s\n' "$GITHUB_REF_NAME" > dist/rox/VERSION
          chmod +x dist/rox/rox
          tar -C dist -czf dist/rox.tar.gz rox
          (cd dist && sha256sum rox.tar.gz > rox.tar.gz.sha256)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/rox.tar.gz dist/rox.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
